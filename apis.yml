name: Angle
description: Angle (Angle Labs, Inc.) is a decentralized, over-collateralized stablecoin protocol
  that issued the euro-pegged EURA and dollar-pegged USDA stablecoins, along with yield-bearing staked
  versions of each. Its on-chain modules included the Transmuter basket-and-dynamic-fee minting system,
  a borrowing module for depositing collateral against stablecoin debt, a native savings system,
  and cross-chain liquidity infrastructure. The protocol is open source under the AngleProtocol GitHub
  organization and ships a TypeScript SDK for building applications on top of it. Angle has announced
  the end of its operations — the protocol remains fully collateralized and every USDA and EURA is
  redeemable 1:1 until 1 March 2027 — and the team's ongoing work has moved to Merkl. Angle exposes
  smart contracts and a client SDK rather than a documented public REST API.
