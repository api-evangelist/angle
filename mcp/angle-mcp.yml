caveats:
- The Angle protocol is winding down (redemption deadline 2027-03-01) and the API was observed flapping
  between HTTP 200 and HTTP 503 on 2026-07-19 — any MCP server built on it must treat every call as failure-prone.
- Four tools (getLeverageV1, getDeleverageV1, getIntegratorsPayloadDepositV1, getIntegratorsPayloadWithdrawV1)
  BUILD unsigned on-chain transaction payloads. They are read-only at the HTTP layer, but their output
  is intended to be signed and broadcast, so an agent must treat them as consequential and require human
  confirmation before the resulting transaction is signed.
- getIntegratorsVaultsOverviewV1 is derived from a malformed section of the published spec (see overlays/angle-api-overlay.yaml);
  confirm it against the live API before relying on it.
